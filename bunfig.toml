# bunfig.toml — bun configuration for Jabr.
#
# `tests/e2e-live.test.ts` requires the live agent stack (ports 4000-4006 +
# jarvis 1337). It participates in the default `bun test` run but every suite
# is gated with `describe.skipIf(!orchestratorUp)`, so it skips cleanly (exit
# 0) when the stack is down and runs for real when it is up. Run it in
# isolation with `bun run test:e2e`.

